apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ojcp-sandbox
  labels:
    app: ojcp-sandbox
  annotations:
    alb.ingress.kubernetes.io/ip-address-type: dualstack
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # ALB health checks send the target IP as Host, which matches no sandbox origin.
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Chat-mode turns call a model and can outlast the 60 s default.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    # No certificate-arn: the controller discovers the ojcp-sandbox-cert
    # certificate from the hosts under spec.tls.
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - sandbox.ojcp.dev
        - '*.sandbox.ojcp.dev'
        - '*.ats.sandbox.ojcp.dev'
  rules:
    # The sandbox home page.
    - host: sandbox.ojcp.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ojcp-sandbox
                port:
                  number: 80
    # Every role's origin: issuer, agent, attest-a, attest-b, lists, acme, acme-careers, ats.
    - host: '*.sandbox.ojcp.dev'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ojcp-sandbox
                port:
                  number: 80
    # Tenants of the demo ATS, e.g. globex.ats.sandbox.ojcp.dev.
    - host: '*.ats.sandbox.ojcp.dev'
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ojcp-sandbox
                port:
                  number: 80
